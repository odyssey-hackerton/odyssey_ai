[project]
name = "odyssey-ai"
version = "0.1.0"
description = "Odyssey 개인정보 보호 서비스 AI 워커 (GPU 서버)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "boto3>=1.35",
    "pillow>=11.0",
    # ① 탐지 로컬 모델. paddlepaddle CPU 휠은 PyPI 에 있다.
    # GPU 서버: uv pip install paddlepaddle-gpu==3.0.0 -i https://www.paddlepaddle.org.cn/packages/stable/cu126/
    "paddlepaddle==3.0.0",
    "paddleocr>=3.1",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "transformers>=4.44",
    "huggingface-hub[cli]>=0.25",
    "ko-pii>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
